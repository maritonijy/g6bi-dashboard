<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060b14">
  <title>Group 6 | Finance Performance Analysis</title>
  <style>
    :root { color-scheme: dark; --bg:#060b14; --line:#283750; --text:#e9eff9; --muted:#9aacc5; --accent:#6fa8ff; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; }
    body { overflow:hidden; background:var(--bg); color:var(--text); font:15px/1.45 "Segoe UI",system-ui,sans-serif; }
    #stage { position:fixed; inset:0; display:grid; place-items:center; padding:16px 12px 70px; }
    #deck { position:relative; width:min(calc(100vw - 24px), calc((100svh - 92px) * 16 / 9)); aspect-ratio:16/9; overflow:hidden; background:#0a1120; box-shadow:0 24px 72px #0009; }
    .slide { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:#0a1120; }
    .slide.active { display:flex; animation:appear .2s ease-out; }
    .slide img { display:block; width:100%; height:100%; object-fit:contain; }
    @keyframes appear { from { opacity:.55 } to { opacity:1 } }
    #controls { position:fixed; z-index:2; bottom:max(12px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:12px; padding:8px 12px; border:1px solid var(--line); border-radius:999px; background:#0a1120ed; box-shadow:0 8px 28px #0008; }
    button { min-width:36px; height:36px; padding:0 11px; border:1px solid #344764; border-radius:999px; background:#14223a; color:var(--text); font:inherit; cursor:pointer; }
    button:hover { border-color:var(--accent); background:#1a2b48; }
    button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    #counter { min-width:58px; text-align:center; color:var(--muted); font-variant-numeric:tabular-nums; font-size:13px; }
    #dots { position:fixed; left:50%; bottom:66px; z-index:2; display:flex; gap:8px; transform:translateX(-50%); }
    #dots button { width:9px; min-width:9px; height:9px; padding:0; border:0; background:#3a4a64; }
    #dots button[aria-current="true"] { background:var(--accent); box-shadow:0 0 9px #6fa8ff99; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:600px) {
      #stage { padding:8px 0 70px; }
      #deck { width:100vw; }
      #controls { gap:8px; padding:6px 9px; }
      button { min-width:34px; height:34px; }
      #dots { bottom:62px; gap:7px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; } }
    @media print {
      html,body { height:auto; overflow:visible; background:#fff; }
      #stage { position:static; display:block; padding:0; }
      #deck { width:100%; height:auto; overflow:visible; box-shadow:none; }
      .slide,.slide.active { position:relative; display:flex; width:100%; aspect-ratio:16/9; break-after:page; page-break-after:always; }
      #controls,#dots { display:none; }
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="Group 6 finance performance presentation">
    <div id="deck">
      <section class="slide" aria-label="Slide 1: Finance Performance Analysis Dashboard"><img src="images/01-title.png" alt="Finance Performance Analysis Dashboard title slide, Group 6"></section>
      <section class="slide" aria-label="Slide 2: Business problem"><img src="images/02-problem.png" alt="Business problem: revenue grows while the company still loses money"></section>
      <section class="slide" aria-label="Slide 3: Dashboard overview"><img src="images/03-overview.png" alt="Overview of the three interactive finance dashboards"></section>
      <section class="slide" aria-label="Slide 4: Star schema"><img src="images/04-schema.png" alt="Star schema and Power BI data model"></section>
      <section class="slide dashboard" aria-label="Slide 5: Executive Financial Health dashboard"><img src="images/05-executive.png" alt="Executive Financial Health dashboard with financial KPIs and monthly trends"></section>
      <section class="slide dashboard" aria-label="Slide 6: Profitability and Budget Analysis dashboard"><img src="images/06-profitability.png" alt="Profitability and Budget Analysis dashboard with department costs and budget variance"></section>
      <section class="slide dashboard" aria-label="Slide 7: Cash, Receivables and Payables dashboard"><img src="images/07-cash.png" alt="Cash, Receivables and Payables dashboard with aging, working capital and currency charts"></section>
      <section class="slide" aria-label="Slide 8: Recommendations"><img src="images/08-recommendations.png" alt="Recommendations for revenue targets, expense control, collections and cash monitoring"></section>
      <section class="slide" aria-label="Slide 9: Conclusion"><img src="images/09-conclusion.png" alt="Conclusion: consolidated financial view supports better decisions"></section>
    </div>
  </main>
  <nav id="dots" aria-label="Choose a slide"></nav>
  <div id="controls" aria-label="Presentation controls">
    <button id="previous" type="button" aria-label="Previous slide" title="Previous (←)">←</button>
    <span id="counter" aria-live="polite">1 / 9</span>
    <button id="next" type="button" aria-label="Next slide" title="Next (→)">→</button>
    <button id="fullscreen" type="button" aria-label="Toggle fullscreen" title="Fullscreen">⛶</button>
  </div>
  <script>
    (() => {
      const slides = [...document.querySelectorAll('.slide')];
      const dots = document.querySelector('#dots');
      const counter = document.querySelector('#counter');
      let current = 0;
      function show(index) {
        current = (index + slides.length) % slides.length;
        slides.forEach((slide, i) => {
          slide.classList.toggle('active', i === current);
          slide.setAttribute('aria-hidden', String(i !== current));
        });
        [...dots.children].forEach((dot, i) => dot.setAttribute('aria-current', String(i === current)));
        counter.textContent = `${current + 1} / ${slides.length}`;
      }
      slides.forEach((_, index) => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.setAttribute('aria-label', `Go to slide ${index + 1}`);
        dot.addEventListener('click', () => show(index));
        dots.append(dot);
      });
      document.querySelector('#previous').addEventListener('click', () => show(current - 1));
      document.querySelector('#next').addEventListener('click', () => show(current + 1));
      document.querySelector('#fullscreen').addEventListener('click', async () => {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
        else await document.exitFullscreen?.();
      });
      document.addEventListener('keydown', event => {
        if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); show(current + 1); }
        if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); show(current - 1); }
        if (event.key === 'Home') show(0);
        if (event.key === 'End') show(slides.length - 1);
      });
      let touchStart = null;
      document.querySelector('#deck').addEventListener('touchstart', event => { touchStart = event.changedTouches[0].clientX; }, { passive:true });
      document.querySelector('#deck').addEventListener('touchend', event => {
        if (touchStart === null) return;
        const delta = event.changedTouches[0].clientX - touchStart;
        if (Math.abs(delta) > 48) show(current + (delta < 0 ? 1 : -1));
        touchStart = null;
      }, { passive:true });
      show(0);
    })();
  </script>
</body>
</html>
